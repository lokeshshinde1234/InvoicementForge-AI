services:
  - type: web
    name: invoice-forge-ai-backend
    env: docker
    rootDir: backend
    healthCheckPath: /health
    preDeployCommand: ./scripts/release.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-forge-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: invoice-forge-ai-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","https://your-vercel-app.vercel.app"]'

  - type: redis
    name: invoice-forge-ai-redis
    ipAllowList: []

databases:
  - name: invoice-forge-ai-db
    plan: free
